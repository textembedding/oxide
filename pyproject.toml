[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "swarm-harness"
version = "0.0.1"
description = "Local spec-driven multi-agent implementation harness"
requires-python = ">=3.11"
dependencies = ["Pygments>=2.19", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
swarmctl = "swarm_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
