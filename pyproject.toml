[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oxide"
version = "0.0.1"
description = "Parallel implementation harness for formally verified Rust programs"
requires-python = ">=3.11"
dependencies = ["Jinja2>=3.1", "Pygments>=2.19"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
eval = ["gepa>=0.1.2,<0.2"]

[project.scripts]
oxide = "oxide.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oxide"]

[tool.hatch.build.targets.wheel.force-include]
"docs/VERIFICATION_PRIMER.md" = "oxide/VERIFICATION_PRIMER.md"

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
