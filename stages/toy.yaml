stage: toy
enabled: true
goal: Prove dependency-aware claim, submit, verify, and merge behavior.
tasks:
  - id: TOY-01
    title: Create the first fixture file
    prompt: Create toy-output/one.txt containing exactly "one" followed by a newline.
    depends_on: []
    checks:
      - test "$(cat toy-output/one.txt)" = "one"
  - id: TOY-02
    title: Create the second fixture file
    prompt: Create toy-output/two.txt containing exactly "two" followed by a newline.
    depends_on:
      - TOY-01
    checks:
      - test "$(cat toy-output/two.txt)" = "two"
  - id: TOY-03
    title: Combine the fixture files
    prompt: Create toy-output/combined.txt with the two prior values on separate lines.
    depends_on:
      - TOY-01
      - TOY-02
    checks:
      - test "$(cat toy-output/combined.txt)" = "$(printf 'one\ntwo')"
stage_gate:
  - test "$(cat toy-output/combined.txt)" = "$(printf 'one\ntwo')"
